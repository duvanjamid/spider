# ══════════════════════════════════════════════════════════════
#  Spider · gateway (reverse proxy) para el entorno LOCAL.
#  Unifica todas las apps bajo un solo origen:
#    /              → app por defecto (admin)
#    /{app}/        → frontend de la app
#    /api/{app}/    → backend de la app
#
#  El generador (skill scaffold-app) inyecta bloques `location`
#  entre los marcadores SCAFFOLD:*. No borres esas líneas.
#
#  En Render cada servicio tiene su propia URL; este gateway
#  reproduce localmente el enrutamiento por path de producción.
# ══════════════════════════════════════════════════════════════
worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  server_tokens off;

  # Cabeceras de seguridad básicas (defensa en profundidad).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  server {
    listen 80;
    server_name _;

    # Raíz → app por defecto.
    location = / { return 302 /admin/; }

    # ═════════════════════ APP: admin ═══════════════════════
    location /api/admin/ {
      proxy_pass         http://admin-backend:8080/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /admin/ {
      proxy_pass         http://admin-frontend:80/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # ────────────────────────────────────────────────────────




    # SCAFFOLD:LOCATIONS  ← no borrar; el generador inyecta apps aquí
    # SCAFFOLD:END
  }
}
