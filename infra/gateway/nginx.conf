# ══════════════════════════════════════════════════════════════
#  Spider · gateway (reverse proxy) · sirve LOCAL y RENDER.
#
#  Punto de entrada único. Enruta por path a servicios AISLADOS:
#    /              → app por defecto (admin)
#    /<app>/        → frontend de la app
#    /<app>-api/    → backend de la app
#
#  Upstreams y puerto se inyectan por variables de entorno (entrypoint.sh
#  sustituye los tokens __…__). Cada upstream es una URL COMPLETA (con
#  esquema): en local http://servicio:puerto; en Render la URL pública
#  https://servicio.onrender.com (el navegador solo ve el gateway → mismo
#  origen, sin CORS; el salto al servicio va server-side).
#
#    __PORT__            (local 80, Render $PORT)
#    __ADMIN_FRONTEND__  (p.ej. http://admin-frontend:80  |  https://admin-frontend-test.onrender.com)
#    __ADMIN_BACKEND__   (p.ej. http://admin-backend:8080 |  https://admin-backend-test.onrender.com)
#
#  El generador (skill scaffold-app) inyecta bloques `location`
#  entre los marcadores SCAFFOLD:*. No borres esas líneas.
# ══════════════════════════════════════════════════════════════
worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  server {
    listen __PORT__;
    server_name _;

    # Detrás del TLS de Render: redirects relativos (sin http://host:puerto).
    absolute_redirect off;
    port_in_redirect off;

    # Health check del propio gateway (para Render).
    location = /healthz { return 200 "ok\n"; }

    # PWA: cada app trae su propio manifest/sw/iconos bajo su ruta (/admin/, /gastos/…),
    # así se instala por separado con su nombre e icono. El gateway solo enruta.

    # Página de carga: cuando un frontend está dormido (free tier) o reiniciando
    # y devuelve 502/503/504, servimos esta página animada con auto-reintento en
    # vez del error crudo. Solo aplica a rutas de FRONTEND (ver location /<app>/);
    # las de API (/<app>-api/) devuelven el error real para que la SPA lo maneje.
    location = /__spider_loading.html {
      internal;
      root /usr/share/nginx/spider;
      add_header Cache-Control "no-store" always;
      add_header X-Spider-Loading "1" always;
    }

    # Raíz → app por defecto.
    location = / { return 302 /admin/; }

    # ═════════════════════ APP: admin ═══════════════════════
    location /admin-api/ {
      proxy_pass         __ADMIN_BACKEND__/;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;                 # SNI para upstreams https
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /admin/ {
      proxy_pass         __ADMIN_FRONTEND__/;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_intercept_errors on;                       # sirve la página de carga…
      error_page 502 503 504 /__spider_loading.html;   # …si el frontend está dormido
    }

    # ═════════════════════ APP: gastos ══════════════════════
    location /gastos-api/ {
      proxy_pass         __GASTOS_BACKEND__/;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /gastos/ {
      proxy_pass         __GASTOS_FRONTEND__/;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_intercept_errors on;
      error_page 502 503 504 /__spider_loading.html;
    }
    # ────────────────────────────────────────────────────────
    # SCAFFOLD:LOCATIONS  ← no borrar; el generador inyecta apps aquí
    # SCAFFOLD:END
  }
}
