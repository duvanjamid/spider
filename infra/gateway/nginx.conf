# ══════════════════════════════════════════════════════════════
#  Spider · gateway (reverse proxy) · sirve LOCAL y RENDER.
#
#  Punto de entrada único. Enruta por path a servicios AISLADOS:
#    /              → app por defecto (admin)
#    /<app>/        → frontend de la app
#    /<app>-api/    → backend de la app
#
#  Los upstreams y el puerto se inyectan por variables de entorno
#  (entrypoint.sh sustituye los tokens __…__):
#    __PORT__            (local 80, Render $PORT)
#    __ADMIN_FRONTEND__  (local admin-frontend:80, Render admin-frontend[-test]:10000)
#    __ADMIN_BACKEND__   (local admin-backend:8080, Render admin-backend[-test]:10000)
#
#  El generador (skill scaffold-app) inyecta bloques `location`
#  entre los marcadores SCAFFOLD:*. No borres esas líneas.
# ══════════════════════════════════════════════════════════════
worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  server {
    listen __PORT__;
    server_name _;

    # Health check del propio gateway (para Render).
    location = /healthz { return 200 "ok\n"; }

    # Raíz → app por defecto.
    location = / { return 302 /admin/; }

    # ═════════════════════ APP: admin ═══════════════════════
    location /admin-api/ {
      proxy_pass         http://__ADMIN_BACKEND__/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /admin/ {
      proxy_pass         http://__ADMIN_FRONTEND__/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
    # ────────────────────────────────────────────────────────
    # SCAFFOLD:LOCATIONS  ← no borrar; el generador inyecta apps aquí
    # SCAFFOLD:END
  }
}
