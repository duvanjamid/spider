<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Spider · iniciando…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Respaldo sin JS: si el JS está desactivado, este refresco recarga la app
       cuando el servicio despierta. Con JS, el redirect es más rápido (ver abajo). -->
  <meta http-equiv="refresh" content="15">
  <meta name="theme-color" content="#0f1115">
  <style>
    :root{
      --bg:#f4f6fb; --panel:#ffffff; --fg:#1e2330; --muted:#5b6472;
      --accent:#6c8cff; --accent2:#10b981; --ring:rgba(108,140,255,.18);
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0f1115; --panel:#161922; --fg:#e6e8ee; --muted:#9aa3b2;
             --accent:#8aa2ff; --accent2:#34d399; --ring:rgba(138,162,255,.16); }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      display:grid; place-items:center; overflow:hidden;
    }
    .stage{ text-align:center; padding:32px; position:relative; z-index:1 }
    /* Telaraña de fondo, sutil */
    .web{ position:fixed; inset:0; z-index:0; opacity:.5; pointer-events:none }
    /* Núcleo animado: araña + órbitas */
    .core{ position:relative; width:150px; height:150px; margin:0 auto 26px }
    .orbit{ position:absolute; inset:0; border-radius:50%; border:1px dashed var(--ring); animation:spin 9s linear infinite }
    .orbit.b{ inset:18px; border-color:var(--ring); animation-duration:6s; animation-direction:reverse }
    .orbit .sat{ position:absolute; top:-5px; left:50%; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:var(--accent) }
    .orbit.b .sat{ background:var(--accent2) }
    .bug{ position:absolute; inset:0; display:grid; place-items:center; font-size:56px; animation:bob 2.4s ease-in-out infinite }
    .glow{ position:absolute; inset:22px; border-radius:50%; background:radial-gradient(circle,var(--ring),transparent 70%); animation:pulse 2.4s ease-in-out infinite }
    h1{ font-size:1.35rem; margin:0 0 8px; letter-spacing:.2px }
    p{ color:var(--muted); margin:0 0 20px; font-size:.95rem }
    .bar{ width:220px; height:6px; margin:0 auto; border-radius:999px; background:var(--ring); overflow:hidden }
    .bar i{ display:block; height:100%; width:40%; border-radius:999px;
            background:linear-gradient(90deg,var(--accent),var(--accent2));
            animation:slide 1.4s ease-in-out infinite }
    .dots{ margin-top:14px; color:var(--muted); font-size:.82rem; letter-spacing:2px }
    @keyframes spin{ to{ transform:rotate(360deg) } }
    @keyframes bob{ 0%,100%{ transform:translateY(-4px) } 50%{ transform:translateY(4px) } }
    @keyframes pulse{ 0%,100%{ transform:scale(.9); opacity:.5 } 50%{ transform:scale(1.08); opacity:1 } }
    @keyframes slide{ 0%{ transform:translateX(-60%) } 50%{ transform:translateX(160%) } 100%{ transform:translateX(-60%) } }
    @media (prefers-reduced-motion: reduce){ *{ animation:none !important } }
  </style>
</head>
<body>
  <svg class="web" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width=".15" opacity=".35" color="var(--accent)">
      <line x1="50" y1="50" x2="50" y2="-10"/><line x1="50" y1="50" x2="95" y2="5"/>
      <line x1="50" y1="50" x2="110" y2="50"/><line x1="50" y1="50" x2="95" y2="95"/>
      <line x1="50" y1="50" x2="50" y2="110"/><line x1="50" y1="50" x2="5" y2="95"/>
      <line x1="50" y1="50" x2="-10" y2="50"/><line x1="50" y1="50" x2="5" y2="5"/>
      <polygon points="50,30 68,42 62,64 38,64 32,42"/>
      <polygon points="50,16 82,38 72,80 28,80 18,38"/>
      <polygon points="50,2 96,34 82,96 18,96 4,34"/>
    </g>
  </svg>

  <div class="stage">
    <div class="core">
      <div class="glow"></div>
      <div class="orbit"><span class="sat"></span></div>
      <div class="orbit b"><span class="sat"></span></div>
      <div class="bug">🕷️</div>
    </div>
    <h1>Iniciando el sistema Spider</h1>
    <p>Estamos despertando los servicios. Esto toma unos segundos…</p>
    <div class="bar"><i></i></div>
    <div class="dots" id="dots">conectando</div>
  </div>

  <script>
    // ── Despierta TODOS los servicios y redirige en cuanto la app esté lista ──
    // 1) Pregunta al admin la lista de apps (endpoint público) — genérico: al
    //    añadir apps nuevas se despiertan solas, sin tocar esta página.
    // 2) Hace peticiones a cada frontend (/slug/) y backend (/slug-api/health)
    //    para forzar el arranque en paralelo (free tier "duerme" los servicios).
    // 3) Sondea la URL pedida; cuando responde OK (ya no es esta página de
    //    carga), redirige. El <meta refresh> queda como respaldo sin JS.
    var msgs = ['conectando', 'despertando servicios', 'casi listo'];
    var i = 0, el = document.getElementById('dots');
    setInterval(function(){ i = (i + 1) % msgs.length; el.textContent = msgs[i] + '…'; }, 1800);

    var done = false;
    function warm(path){ fetch(path, { method: 'GET', cache: 'no-store' }).catch(function(){}); }

    function warmAll(){
      warm('/healthz');
      // La lista de apps (también despierta el backend del admin).
      fetch('/admin-api/apps', { cache: 'no-store' })
        .then(function(r){ return r.ok ? r.json() : []; })
        .then(function(apps){
          (apps || []).forEach(function(a){
            if (a && a.slug){ warm('/' + a.slug + '/'); warm('/' + a.slug + '-api/health'); }
          });
        })
        .catch(function(){ warm('/admin/'); warm('/admin-api/health'); });
    }

    function checkReady(){
      if (done) return;
      fetch(location.href, { method: 'GET', cache: 'no-store' })
        .then(function(r){
          // r.ok (200) y sin la cabecera de esta página = la app ya responde.
          if (r.ok && !r.headers.get('x-spider-loading')){
            done = true;
            el.textContent = '¡listo! entrando…';
            location.reload();
          }
        })
        .catch(function(){});
    }

    warmAll();
    var w = setInterval(warmAll, 6000);      // insiste hasta que respondan
    var c = setInterval(checkReady, 2500);   // redirige en cuanto esté lista
    window.addEventListener('pagehide', function(){ clearInterval(w); clearInterval(c); });
  </script>
</body>
</html>
