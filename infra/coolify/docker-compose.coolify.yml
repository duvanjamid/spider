# ══════════════════════════════════════════════════════════════
#  Spider · despliegue en COOLIFY (Docker Compose, un solo recurso)
#
#  Equivalente a render.yaml pero para Coolify. Levanta el gateway +
#  TODAS las apps (backend y frontend) como un único recurso.
#
#  Diferencias con docker-compose.yml (local):
#    · SIN servicio `db`: la Postgres es un recurso GESTIONADO de Coolify
#      (una BD por entorno: spider-db-test / spider-db-prod). Los backends
#      la alcanzan por DB_HOST/DB_* (misma red `coolify`).
#    · SIN puertos publicados al host: Coolify + Traefik hacen el ingress.
#      Solo el `gateway` se expone públicamente (dominio del entorno).
#    · Secretos y conexión a BD llegan por variables (ver .env.coolify.example).
#
#  Entrada única: https://<dominio>  → gateway → /admin, /gastos, …
#
#  Ver infra/coolify/README.md para la guía de migración paso a paso.
#
#  NOTA build contexts: relativos a la RAÍZ del repo (apps/…, infra/…), no a
#  esta carpeta. Coolify despliega con --project-directory = raíz del repo.
#
#  MEMORIA: cada servicio tiene `mem_limit` para no malgastar RAM. Los
#  backends Java capan el heap al 70% del límite (JAVA_TOOL_OPTIONS +
#  SerialGC del entrypoint). Total ~2.6 GB con las 4 apps arriba.
#
#  DB_SCHEMA usa ${SCHEMA_PREFIX} (por defecto vacío = schema <app>). Como
#  cada entorno tiene su PROPIA BD, se usan schemas planos; el prefijo queda
#  disponible por si alguna vez se comparte una BD entre entornos.
# ══════════════════════════════════════════════════════════════
services:
  # ── Gateway: ÚNICO servicio expuesto. Enruta /<app> y /<app>-api. ──
  gateway:
    build: infra/gateway
    # SERVICE_FQDN_GATEWAY_80: Coolify expone este servicio (puerto 80) con
    # el dominio del entorno y genera las labels de Traefik.
    environment:
      - SERVICE_FQDN_GATEWAY_80
      - PORT=80
    depends_on:
      - admin-backend
      - admin-frontend
    restart: unless-stopped
    mem_limit: 96m
    networks: [coolify, default]

  # ═════════════════════ APP: admin (plataforma) ═════════════════════
  admin-backend:
    build: apps/admin/backend
    environment:
      APP_NAME: admin
      DB_SCHEMA: ${SCHEMA_PREFIX:-}admin
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-spider}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      REGISTRY_TOKEN: ${REGISTRY_TOKEN}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Login de desarrollo (sin Google). Solo test: AUTH_DEV_LOGIN=true.
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://spider.muvatec.com}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    restart: unless-stopped
    mem_limit: 640m
    networks: [coolify, default]

  admin-frontend:
    build: apps/admin/frontend
    environment:
      PORT: 80
    depends_on:
      - admin-backend
    restart: unless-stopped
    mem_limit: 96m
    networks: [coolify, default]

  # ═════════════════════ APP: gastos ═════════════════════════
  gastos-backend:
    build: apps/gastos/backend
    environment:
      APP_NAME: gastos
      DB_SCHEMA: ${SCHEMA_PREFIX:-}gastos
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-spider}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    restart: unless-stopped
    mem_limit: 640m
    networks: [coolify, default]

  gastos-frontend:
    build: apps/gastos/frontend
    environment:
      PORT: 80
    depends_on:
      - gastos-backend
    restart: unless-stopped
    mem_limit: 96m
    networks: [coolify, default]

  # ═════════════════════ APP: electrolineras ═════════════════════════
  electrolineras-backend:
    build: apps/electrolineras/backend
    environment:
      APP_NAME: electrolineras
      DB_SCHEMA: ${SCHEMA_PREFIX:-}electrolineras
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-spider}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Sesión y registro heredan del admin (mismo secreto/token).
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      REGISTRY_TOKEN: ${REGISTRY_TOKEN}
      ADMIN_REGISTRY_URL: http://admin-backend:8080
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    restart: unless-stopped
    mem_limit: 640m
    networks: [coolify, default]

  electrolineras-frontend:
    build: apps/electrolineras/frontend
    environment:
      PORT: 80
    depends_on:
      - electrolineras-backend
    restart: unless-stopped
    mem_limit: 96m
    networks: [coolify, default]

  # ═════════════════════ APP: alertas ═════════════════════════
  alertas-backend:
    build: apps/alertas/backend
    environment:
      APP_NAME: alertas
      DB_SCHEMA: ${SCHEMA_PREFIX:-}alertas
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-spider}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      REGISTRY_TOKEN: ${REGISTRY_TOKEN}
      ADMIN_REGISTRY_URL: http://admin-backend:8080
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    restart: unless-stopped
    mem_limit: 640m
    networks: [coolify, default]

  alertas-frontend:
    build: apps/alertas/frontend
    environment:
      PORT: 80
    depends_on:
      - alertas-backend
    restart: unless-stopped
    mem_limit: 96m
    networks: [coolify, default]

networks:
  # Red compartida de Coolify: permite alcanzar la BD gestionada
  # (spider-db-test / spider-db-prod) por su hostname interno.
  coolify:
    external: true
  default: {}
