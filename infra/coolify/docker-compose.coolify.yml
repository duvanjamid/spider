# ══════════════════════════════════════════════════════════════
#  Spider · despliegue en COOLIFY (Docker Compose, un solo recurso)
#
#  Equivalente a render.yaml pero para Coolify. Levanta el gateway +
#  TODAS las apps (backend y frontend) como un único recurso.
#
#  ENV COMPARTIDAS: todas las apps (admin + sub-apps) usan el MISMO set de
#  variables (bloque `x-common-env`). Se definen UNA vez en Coolify y aplican
#  a todos los backends. Lo único por-app es APP_NAME y DB_SCHEMA (estructural,
#  no secreto). Así no hay envVars distintas por app.
#
#  Diferencias con docker-compose.yml (local):
#    · SIN servicio `db`: Postgres es un recurso GESTIONADO de Coolify, una BD
#      por entorno (spider-db-test / spider-db-prod), INTERNA (red `coolify`,
#      sin puerto público). Los backends la alcanzan por DB_HOST/DB_*.
#    · SIN puertos al host: Coolify + Traefik hacen el ingress. Solo el
#      `gateway` se expone con el dominio del entorno.
#
#  Entrada única: https://<dominio>  → gateway → /admin, /gastos, …
#
#  NOTA build contexts: relativos a la RAÍZ del repo (Coolify usa
#  --project-directory = raíz). MEMORIA: mem_limit por servicio; los backends
#  Java capan heap al 70% (JAVA_TOOL_OPTIONS + SerialGC). ~2.6 GB con 4 apps.
#  Cada entorno tiene su BD → schemas planos (SCHEMA_PREFIX por defecto vacío).
#
#  AISLAMIENTO DE RED (importante):
#    Coolify crea AUTOMÁTICAMENTE una red propia por recurso (nombre = uuid del
#    app, distinta en test y prod) y conecta a ella TODOS los servicios del
#    compose + su Traefik (ver label `traefik.docker.network`). Esa red es única
#    por entorno, así que dentro de ella los nombres de servicio (`admin-backend`,
#    …) resuelven SIN chocar con el otro entorno.
#
#    Por eso el gateway NO va en la red compartida `coolify`: resuelve los
#    upstreams por su nombre corto en la red por-app (aislada) y nunca ve los
#    contenedores homónimos del otro entorno. (El intento anterior de aliases
#    `${NS}-<servicio>` sobre la red `coolify` NO sirve: Coolify 4.3.14 los BORRA
#    al parsear el compose.)
#
#    Los BACKENDS sí siguen en `coolify` porque ahí vive la BD gestionada
#    (DB_HOST). El gateway igual los alcanza por la red por-app.
# ══════════════════════════════════════════════════════════════

# ── Env COMPARTIDA por todos los backends (se define una vez en Coolify). ──
x-common-env: &common-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-spider}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
  REGISTRY_TOKEN: ${REGISTRY_TOKEN}
  # Auto-registro vía el gateway (resuelve `gateway` en la red por-app, aislada
  # por entorno). El gateway enruta /admin-api → admin-backend del MISMO entorno.
  ADMIN_REGISTRY_URL: http://gateway/admin-api
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-false}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://spider.muvatec.com}
  # Web Push (VAPID). Solo lo usa gastos; el resto de backends lo ignora. Las
  # claves se definen como env del app en Coolify (NUNCA en el repo). Sin ellas,
  # el push queda deshabilitado y la app sigue funcionando igual.
  VAPID_PUBLIC: ${VAPID_PUBLIC:-}
  VAPID_PRIVATE: ${VAPID_PRIVATE:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@spider.muvatec.com}
  # Zona horaria de la app (por defecto Colombia, GMT-5). Así LocalDate.now()/
  # YearMonth.now() del backend siguen la hora del usuario y no la UTC del server.
  TZ: ${TZ:-America/Bogota}
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -Duser.timezone=${TZ:-America/Bogota}"

services:
  # ── Gateway: ÚNICO servicio expuesto. Enruta /<app> y /<app>-api. ──
  gateway:
    build: infra/gateway
    # Upstreams por NOMBRE CORTO: se resuelven en la red por-app (aislada por
    # entorno que crea Coolify), así el gateway nunca alcanza los contenedores
    # homónimos del otro entorno. El gateway NO va en la red `coolify` (Traefik
    # lo alcanza por la red por-app, ver label traefik.docker.network).
    environment:
      - SERVICE_FQDN_GATEWAY_80
      - PORT=80
      - ADMIN_BACKEND=http://admin-backend:8080
      - ADMIN_FRONTEND=http://admin-frontend:80
      - GASTOS_BACKEND=http://gastos-backend:8080
      - GASTOS_FRONTEND=http://gastos-frontend:80
      - ELECTROLINERAS_BACKEND=http://electrolineras-backend:8080
      - ELECTROLINERAS_FRONTEND=http://electrolineras-frontend:80
      - ALERTAS_BACKEND=http://alertas-backend:8080
      - ALERTAS_FRONTEND=http://alertas-frontend:80
    depends_on:
      - admin-backend
      - admin-frontend
    restart: unless-stopped
    mem_limit: 96m
    networks: [default]

  # ═════════════════════ APP: admin (plataforma) ═════════════════════
  admin-backend:
    build: apps/admin/backend
    environment:
      <<: *common-env
      APP_NAME: admin
      DB_SCHEMA: ${SCHEMA_PREFIX:-}admin
    restart: unless-stopped
    mem_limit: 640m
    networks:
      default: {}
      coolify: { aliases: ["${NS}-admin-backend"] }

  admin-frontend:
    build: apps/admin/frontend
    environment:
      PORT: 80
      PWA_PREFIX: ${PWA_PREFIX:-}
    depends_on:
      - admin-backend
    restart: unless-stopped
    mem_limit: 96m
    networks:
      default: {}
      coolify: { aliases: ["${NS}-admin-frontend"] }

  # ═════════════════════ APP: gastos ═════════════════════════
  gastos-backend:
    build: apps/gastos/backend
    environment:
      <<: *common-env
      APP_NAME: gastos
      DB_SCHEMA: ${SCHEMA_PREFIX:-}gastos
    restart: unless-stopped
    mem_limit: 640m
    networks:
      default: {}
      coolify: { aliases: ["${NS}-gastos-backend"] }

  gastos-frontend:
    build: apps/gastos/frontend
    environment:
      PORT: 80
      PWA_PREFIX: ${PWA_PREFIX:-}
    depends_on:
      - gastos-backend
    restart: unless-stopped
    mem_limit: 96m
    networks:
      default: {}
      coolify: { aliases: ["${NS}-gastos-frontend"] }

  # ═════════════════════ APP: electrolineras ═════════════════════════
  electrolineras-backend:
    build: apps/electrolineras/backend
    environment:
      <<: *common-env
      APP_NAME: electrolineras
      DB_SCHEMA: ${SCHEMA_PREFIX:-}electrolineras
    restart: unless-stopped
    mem_limit: 640m
    networks:
      default: {}
      coolify: { aliases: ["${NS}-electrolineras-backend"] }

  electrolineras-frontend:
    build: apps/electrolineras/frontend
    environment:
      PORT: 80
      PWA_PREFIX: ${PWA_PREFIX:-}
    depends_on:
      - electrolineras-backend
    restart: unless-stopped
    mem_limit: 96m
    networks:
      default: {}
      coolify: { aliases: ["${NS}-electrolineras-frontend"] }

  # ═════════════════════ APP: alertas ═════════════════════════
  alertas-backend:
    build: apps/alertas/backend
    environment:
      <<: *common-env
      APP_NAME: alertas
      DB_SCHEMA: ${SCHEMA_PREFIX:-}alertas
    restart: unless-stopped
    mem_limit: 640m
    networks:
      default: {}
      coolify: { aliases: ["${NS}-alertas-backend"] }

  alertas-frontend:
    build: apps/alertas/frontend
    environment:
      PORT: 80
      PWA_PREFIX: ${PWA_PREFIX:-}
    depends_on:
      - alertas-backend
    restart: unless-stopped
    mem_limit: 96m
    networks:
      default: {}
      coolify: { aliases: ["${NS}-alertas-frontend"] }

networks:
  # Red compartida de Coolify: alcanza la BD gestionada por su hostname interno.
  coolify:
    external: true
  default: {}
