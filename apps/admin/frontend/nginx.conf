server {
  # __PORT__ lo reemplaza el entrypoint: 80 en local, $PORT en Render.
  listen __PORT__;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta desconocida sirve el index (Angular router).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache agresivo para assets con hash.
  location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
